name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Ruff, Semgrep and Gitleaks (pinned, checksum verified)
        run: bash scripts/install-tools.sh

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - name: Integration tests (real tools; fail if any is missing)
        run: pnpm test:integration
        env:
          PR_MENTOR_REQUIRE_TOOLS: "1"
      - name: Eval harness self-check (oracle must score 100%)
        run: pnpm eval --mode oracle --check-thresholds
      - name: Static eval (fails if precision or recall drops below evals/thresholds.json)
        run: pnpm eval --mode static --check-thresholds
