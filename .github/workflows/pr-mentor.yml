# PR Mentor reviews this repository's own pull requests, using the action in this repo.
name: PR Mentor

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The action and workspace come from the trusted base commit.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Fetch PR objects without checking them out
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git cat-file -e "${PR_HEAD}^{commit}"
      - uses: ./
        with:
          trusted-base-checkout: "true"
          anthropic-api-key: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.ANTHROPIC_API_KEY || '' }}
