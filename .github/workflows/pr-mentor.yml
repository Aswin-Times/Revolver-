# PR Mentor reviews this repository's own pull requests, using the action in this repo.
name: PR Mentor

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so PR Mentor can diff base...head, at the PR head (not the merge commit).
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./
        with:
          # Optional: without this secret the review is static-only.
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
